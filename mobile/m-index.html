<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>上班打卡 · 签到打卡系统</title>
<link rel="stylesheet" href="../assets/styles.css">
<style>
  /* ---------- 页面级布局微调（颜色一律 var(--xxx)） ---------- */
  .m-block { margin-bottom: 14px; }
  .strip-lines { display: flex; flex-direction: column; gap: 1px; line-height: 1.5; }
  .strip-lines__sub { font-size: 11.5px; opacity: .85; }
  #liveClock { font-size: 40px; font-weight: 700; letter-spacing: 1.5px; line-height: 1.25; }
  .clock-date { font-size: 12.5px; color: var(--text-sub); margin: 4px 0 16px; }
  #btnOff { width: 150px; height: 150px; display: none; margin-top: 16px; }
  #btnOff.show { display: flex; }
  #btnOff .clock-face__label { font-size: 15px; letter-spacing: 1.5px; }
  .clock-face--done .pulse-ring { display: none; }
  .clock-face.loading { opacity: .82; }
  .stat-line { margin-top: 16px; font-size: 13px; color: var(--text-sub); text-align: center; }
  .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .quick-grid .btn { padding: 10px 8px; font-size: 13px; }
</style>
</head>
<body data-page="index">
<div class="m-stage"><div class="m-frame"><div class="m-app">
  <header class="m-header">
    <div class="m-header__row"><span class="m-header__date" id="mDate"></span>
      <div class="avatar avatar--sm">陈</div></div>
    <h1 class="m-header__title">上班打卡</h1>
  </header>
  <main class="m-content">

    <!-- 定位状态条 -->
    <div class="info-strip info-strip--ok m-block reveal d1"><i data-icon="map-pin"></i>
      <div class="strip-lines">
        <span>已进入打卡范围 · GPS 定位连接正常</span>
        <span class="strip-lines__sub">定位：总部大楼 A 座 · 距离 <span class="mono">86m</span></span>
      </div>
    </div>

    <!-- 打卡区：实时时钟 + 状态机按钮 -->
    <div class="clock-btn-wrap m-block reveal d2">
      <div class="mono" id="liveClock">--:--:--</div>
      <div class="clock-date" id="clockDate">今天 -- · 标准班次 --</div>

      <button class="clock-face" id="btnOn" type="button">
        <span class="pulse-ring"></span>
        <span class="clock-face__label" id="btnOnLabel">上班打卡</span>
        <span class="clock-face__time mono" id="btnOnTime">点击打卡</span>
        <span class="clock-face__sub"><i data-icon="map-pin"></i>GPS · 总部大楼 A 座</span>
      </button>

      <button class="clock-face" id="btnOff" type="button">
        <span class="pulse-ring"></span>
        <span class="clock-face__label" id="btnOffLabel">下班打卡</span>
        <span class="clock-face__time mono" id="btnOffTime">点击打卡</span>
        <span class="clock-face__sub"><i data-icon="log-out"></i>GPS · 总部大楼 A 座</span>
      </button>

      <div class="stat-line" id="statLine" style="display:none"></div>
    </div>

    <!-- 今日时间线 -->
    <div class="card m-block reveal d3">
      <div class="card__head"><div class="card__title"><i data-icon="timer"></i>今日时间线</div></div>
      <div class="card__body">
        <div class="timeline">
          <div class="tl-item">
            <span class="tl-dot tl-dot--done"></span>
            <div class="tl-item__time mono" id="tlOnTime">--:--</div>
            <div class="tl-item__meta">上班打卡 · <i data-icon="map-pin"></i><span id="tlOnMeta">GPS · 总部大楼 A 座</span></div>
          </div>
          <div class="tl-item">
            <span class="tl-dot tl-dot--off" id="tlOffDot"></span>
            <div class="tl-item__time mono" id="tlOffTime">18:00</div>
            <div class="tl-item__meta faint" id="tlOffMeta">预计下班 · 标准班次 09:00-18:00</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 快捷入口 -->
    <div class="quick-grid m-block reveal d4">
      <button class="btn btn--ghost" id="qField" type="button"><i data-icon="navigation"></i>外勤打卡</button>
      <a class="btn btn--ghost" href="m-apply.html"><i data-icon="file-text"></i>申请补卡</a>
    </div>

    <!-- 规则速览 -->
    <div class="rule-note reveal d5">
      <h4><i data-icon="shield-check"></i>打卡规则速览</h4>
      <ol>
        <li><b>迟到</b>：<span class="mono">09:10</span> 后上班打卡计迟到。</li>
        <li><b>严重迟到</b>：<span class="mono">09:30</span> 后上班打卡计严重迟到。</li>
        <li><b>补卡</b>：每月 ≤ <span class="mono">3</span> 次（本月已用 <span class="mono">1</span> 次）。</li>
        <li><b>工时</b>：统计自动扣除午休 <span class="mono">1</span> 小时。</li>
      </ol>
    </div>

  </main>
  <nav class="m-tabbar">
    <a class="m-tab" data-nav="index" href="m-index.html"><i data-icon="clock"></i><span>打卡</span></a>
    <a class="m-tab" data-nav="records" href="m-records.html"><i data-icon="calendar"></i><span>记录</span></a>
    <a class="m-tab" data-nav="apply" href="m-apply.html"><i data-icon="file-text"></i><span>申请</span></a>
    <a class="m-tab" data-nav="stats" href="m-stats.html"><i data-icon="user"></i><span>我的</span></a>
  </nav>
</div></div></div>
<script src="../assets/icons.js"></script><script src="../assets/mock.js"></script>
<script src="../assets/api.js"></script><script src="../assets/app.js"></script>
<script>
/* ============================================================
   m-index 页面逻辑：打卡状态机（localStorage key: ci_state）
   状态：{ date, on:{time,method,loc}|null, off:{time,method}|null }
   ============================================================ */
(function () {
  var LS_KEY = "ci_state";
  var rule = DB.rules[0]; // 总部标准考勤（默认）
  var btnOn = document.getElementById("btnOn");
  var btnOff = document.getElementById("btnOff");
  var btnOnLabel = document.getElementById("btnOnLabel");
  var btnOnTime = document.getElementById("btnOnTime");
  var btnOffLabel = document.getElementById("btnOffLabel");
  var btnOffTime = document.getElementById("btnOffTime");
  var statLine = document.getElementById("statLine");
  var tlOnTime = document.getElementById("tlOnTime");
  var tlOffTime = document.getElementById("tlOffTime");
  var tlOffDot = document.getElementById("tlOffDot");
  var tlOffMeta = document.getElementById("tlOffMeta");
  var busy = false;

  /* 日期行：今天 2026-09-17 周四 · 标准班次 09:00-18:00 */
  document.getElementById("clockDate").innerHTML =
    "今天 <span class='mono'>" + DB.today + "</span> " + DB.todayWeek +
    " · 标准班次 <span class='mono'>" + rule.onDuty + "-" + rule.offDuty + "</span>";

  /* ---------- 初始状态：localStorage 优先，回退 DB.records 今日记录 ---------- */
  function initState() {
    try {
      var saved = JSON.parse(localStorage.getItem(LS_KEY));
      if (saved && saved.date === DB.today) return saved;
    } catch (e) { /* 忽略解析异常，回退 DB */ }
    var rec = DB.records[DB.records.length - 1];
    var s = { date: DB.today, on: null, off: null };
    if (rec && rec.date === DB.today) {
      if (rec.on) s.on = { time: rec.on.time, method: rec.on.method, loc: rec.on.loc || "总部大楼 A 座" };
      if (rec.off) s.off = { time: rec.off.time, method: rec.off.method };
    }
    return s;
  }
  function save() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { /* 演示环境可忽略 */ }
  }

  var state = initState();

  /* ---------- 工时：下班-上班，扣午休 1h ---------- */
  function durationText(onT, offT) {
    var a = onT.split(":"), b = offT.split(":");
    var mins = (Number(b[0]) * 60 + Number(b[1])) - (Number(a[0]) * 60 + Number(a[1])) - 60;
    if (mins < 0) mins += 24 * 60;
    return Math.floor(mins / 60) + "h" + String(mins % 60).padStart(2, "0") + "m";
  }

  /* ---------- 渲染两个按钮 + 工时行 + 时间线 ---------- */
  function render() {
    /* 上班按钮 */
    if (state.on) {
      btnOn.classList.add("clock-face--done");
      btnOnLabel.textContent = "已上班 " + state.on.time;
      btnOnTime.textContent = "打卡完成";
    } else {
      btnOn.classList.remove("clock-face--done");
      btnOnLabel.textContent = "上班打卡";
      btnOnTime.textContent = "点击打卡";
    }
    /* 下班按钮：已上班后出现 */
    if (state.on) {
      btnOff.classList.add("show");
      if (state.off) {
        btnOff.classList.add("clock-face--done");
        btnOffLabel.textContent = "已下班 " + state.off.time;
        btnOffTime.textContent = "打卡完成";
      } else {
        btnOff.classList.remove("clock-face--done");
        btnOffLabel.textContent = "下班打卡";
        btnOffTime.textContent = "点击打卡";
      }
    } else {
      btnOff.classList.remove("show");
    }
    /* 今日工时统计行（上下班均完成） */
    if (state.on && state.off) {
      statLine.style.display = "block";
      statLine.innerHTML = "今日工时 <b class='mono'>" + durationText(state.on.time, state.off.time) +
        "</b>（已扣除午休 1h）";
    } else {
      statLine.style.display = "none";
    }
    /* 时间线 */
    tlOnTime.textContent = state.on ? state.on.time : "--:--";
    if (state.off) {
      tlOffTime.textContent = state.off.time;
      tlOffDot.className = "tl-dot tl-dot--done";
      tlOffMeta.className = "tl-item__meta";
      tlOffMeta.textContent = "下班打卡 · GPS 定位";
    } else {
      tlOffTime.textContent = rule.offDuty;
      tlOffDot.className = "tl-dot tl-dot--off";
      tlOffMeta.className = "tl-item__meta faint";
      tlOffMeta.textContent = "预计下班 · 标准班次 " + rule.onDuty + "-" + rule.offDuty;
    }
  }

  /* ---------- 打卡动作：loading(定位中…, 600ms) → API → 更新状态 ---------- */
  function punch(kind) {
    if (busy) return;
    if (kind === "on" && state.on) { App.toast("今日该时段已打卡", "info"); return; }
    if (kind === "off" && state.off) { App.toast("今日该时段已打卡", "info"); return; }
    if (kind === "off" && !state.on) { App.toast("请先完成上班打卡", "info"); return; }

    busy = true;
    var btn = kind === "on" ? btnOn : btnOff;
    var label = kind === "on" ? btnOnLabel : btnOffLabel;
    var oldText = label.textContent;
    btn.classList.add("loading");
    label.textContent = "定位中…";

    setTimeout(function () {
      var req = kind === "on"
        ? API.clockIn({ empId: DB.currentUser.id, method: "gps", loc: "总部大楼 A 座" })
        : API.clockOut({ empId: DB.currentUser.id, method: "gps" });

      req.then(function (res) {
        btn.classList.remove("loading");
        busy = false;
        if (res.code === 0) {
          var t = res.data.time; // 当前系统时间 HH:MM
          if (kind === "on") state.on = { time: t, method: "gps", loc: "总部大楼 A 座" };
          else state.off = { time: t, method: "gps" };
          save();
          render();
          App.toast((kind === "on" ? "上班打卡成功 " : "下班打卡成功 ") + t + " · GPS 定位", "success");
        } else {
          label.textContent = oldText;
          App.toast(res.msg || "打卡失败，请重试", "error");
        }
      });
    }, 600);
  }

  btnOn.addEventListener("click", function () { punch("on"); });
  btnOff.addEventListener("click", function () { punch("off"); });

  /* 外勤打卡：提示后跳申请页 */
  document.getElementById("qField").addEventListener("click", function () {
    App.toast("请提交外勤申请：拍照 + 事由", "info");
    setTimeout(function () { location.href = "m-apply.html"; }, 900);
  });

  render();
})();
</script>
</body>
</html>
